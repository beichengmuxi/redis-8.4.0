name: Build Redis 8.4.0 (aarch64)
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cross compiler
        run: sudo apt update && sudo apt install -y gcc-aarch64-linux-gnu make
      - name: Build Redis
        run: |
          make distclean
          CC=aarch64-linux-gnu-gcc make -j2 MALLOC=libc
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: redis-8.4.0-aarch64
          path: src/redis-server
